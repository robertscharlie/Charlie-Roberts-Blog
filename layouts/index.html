{{ define "main" }}
  {{ partial "hero.html" . }}

  <section class="section" id="projects" aria-labelledby="projects-heading">
    <h2 id="projects-heading">Projects</h2>
    <div class="card-grid">
      {{ range (where .Site.RegularPages "Section" "projects").ByDate.Reverse }}
      {{ partial "project-card.html" . }}
      {{ end }}
    </div>
  </section>
{{ end }}
