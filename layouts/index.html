{{ define "main" }}
  {{ partial "about-section.html" . }}

  <section class="section" id="projects" aria-labelledby="projects-heading">
    <p class="eyebrow">02 &middot; Projects</p>
    <h2 id="projects-heading">Projects</h2>
    <div class="project-list">
      {{ range $i, $p := (where site.RegularPages "Section" "projects").ByDate.Reverse }}
      {{ partial "project-row.html" (dict "page" $p "index" (add $i 1)) }}
      {{ end }}
    </div>
  </section>
{{ end }}
