<section class="hero" id="about">
  <div class="shell hero-inner">
    <div class="hero-text">
      <h1>{{ .Site.Params.author }}</h1>
      <div class="content-body hero-about">
        {{ with site.GetPage "/about" }}{{ .Content }}{{ end }}
      </div>
      {{ with .Site.Params.location }}<p class="hero-meta">{{ . }}</p>{{ end }}
    </div>
    {{ with .Site.Params.profilePicture }}
    <img class="profile-pic" src="{{ . | relURL }}" alt="{{ $.Site.Params.author }}">
    {{ else }}
    <div class="profile-pic profile-pic-placeholder" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
        <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    {{ end }}
  </div>
</section>
