<a class="card" href="{{ .RelPermalink }}">
  <div class="card-photo">
    {{ if .Params.image }}
    <img src="{{ .Params.image | relURL }}" alt="{{ .Title }}" loading="lazy">
    {{ else }}
    <span class="card-photo-label">Photo coming soon</span>
    {{ end }}
  </div>
  <h3>{{ .Title }}</h3>
  <p>{{ .Summary }}</p>
</a>
