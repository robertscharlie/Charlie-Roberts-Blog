<header class="site-header">
  <a class="brand" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Params.author }}</a>
  <nav class="site-nav">
    {{ range .Site.Menus.main }}
    <a href="{{ .URL | relLangURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
