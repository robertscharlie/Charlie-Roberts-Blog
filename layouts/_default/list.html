{{ define "main" }}
  <div class="list-page">
    <div class="page-header">
      <h1><span class="designator">U</span>{{ .Title }}</h1>
      {{ with .Content }}<div class="content-body" style="padding-top:0;">{{ . }}</div>{{ end }}
    </div>

    <div class="card-grid">
      {{ range .Pages.ByDate.Reverse }}
      {{ partial "project-card.html" . }}
      {{ end }}
    </div>
  </div>
{{ end }}
