{{ define "main" }}
  <div class="list-page">
    <div class="page-header">
      <h1><span class="designator">U</span>{{ .Title }}</h1>
      {{ with .Content }}<div class="content-body" style="padding-top:0;">{{ . }}</div>{{ end }}
    </div>

    <div class="card-grid">
      {{ range .Pages.ByDate.Reverse }}
      <a class="card" href="{{ .RelPermalink }}">
        <span class="card-designator">{{ if .Params.designator }}{{ .Params.designator }}{{ else }}U{{ end }}</span>
        <h3>{{ .Title }}</h3>
        <p>{{ .Summary }}</p>
      </a>
      {{ end }}
    </div>
  </div>
{{ end }}
