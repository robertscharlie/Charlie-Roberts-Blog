baseURL = "https://robertscharlie.github.io/Charlie-Roberts-Blog/"
locale = "en-gb"
title = "Charlie Roberts"
enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"
    lineNos = false
    noClasses = true

[params]
  description = "MEng Electrical and Electronics Engineering student at Imperial College London — circuits, software, and side projects."
  author = "Charlie Roberts"
  location = "London, United Kingdom"
  # Add a photo to static/images/, then put its path here, e.g. "images/profile.jpg"
  profilePicture = ""

[permalinks]
  projects = "/projects/:slug/"
